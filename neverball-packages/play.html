<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Neverball Packages — Play</title>
  <style>
    :root {
      --ink: #1a2433;
      --foam: #f4f7fb;
      --turf: #3d9660;
      --accent: #e8b84a;
      --sky0: #6fb6e8;
      --sky1: #d7ecfa;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: #0f1722;
      color: var(--foam);
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    }
    #wrap {
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 12px;
      background:
        radial-gradient(ellipse at 30% 10%, #1d3a55 0%, transparent 50%),
        radial-gradient(ellipse at 80% 90%, #163028 0%, transparent 45%),
        #0f1722;
    }
    #panel {
      width: min(960px, 100%);
      display: grid;
      gap: 10px;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px 16px;
    }
    h1 {
      margin: 0;
      font-size: clamp(1.2rem, 3vw, 1.7rem);
      letter-spacing: 0.02em;
      font-weight: 800;
    }
    header p {
      margin: 0;
      opacity: 0.75;
      font-size: 0.9rem;
    }
    #hud {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 18px;
      font-variant-numeric: tabular-nums;
      font-size: 0.95rem;
    }
    #hud strong { color: var(--accent); }
    canvas {
      width: 100%;
      height: auto;
      aspect-ratio: 960 / 600;
      border-radius: 14px;
      display: block;
      background: #000;
      box-shadow: 0 18px 50px rgba(0,0,0,.45);
      touch-action: none;
    }
    #help {
      opacity: 0.7;
      font-size: 0.85rem;
    }
    button {
      appearance: none;
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      background: var(--accent);
      color: #1a1508;
      font-weight: 700;
      cursor: pointer;
    }
    button.secondary {
      background: #2a3a4d;
      color: var(--foam);
    }
    .row { display: flex; flex-wrap: wrap; gap: 8px; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="panel">
      <header>
        <div>
          <h1>Neverball Packages</h1>
          <p>Browser tilt-ball demo · inspired by Neverball</p>
        </div>
        <div class="row">
          <button id="btnStart" type="button">Play / Resume</button>
          <button id="btnRestart" class="secondary" type="button">Restart</button>
        </div>
      </header>
      <div id="hud">
        <div>Level <strong id="hLevel">1</strong></div>
        <div>Coins <strong id="hCoins">0</strong>/<span id="hNeed">0</span></div>
        <div>Time <strong id="hTime">0.0</strong>s</div>
        <div>Balls <strong id="hLives">3</strong></div>
        <div id="hMsg"></div>
      </div>
      <canvas id="game" width="960" height="600"></canvas>
      <div id="help">Arrow keys / WASD tilt · R restart · Enter continue · on phone: drag to tilt</div>
    </div>
  </div>
  <script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const LEVELS = [
    {
      name: 'Meadow Start',
      time: 70,
      need: 5,
      message: 'Tilt the floor. Collect coins, then reach the gold exit.',
      platforms: [[-7,-7,14,14]],
      walls: [],
      hazards: [],
      coins: [[-3,-2,1],[3,-2,1],[-3,3,1],[3,3,1],[0,5,5]],
      spawn: [0,0],
      goal: [0,5.5,1.5],
    },
    {
      name: 'Narrow Bridge',
      time: 75,
      need: 6,
      message: 'Stay centered — the bridge is thin.',
      platforms: [[-2,-8,4,6],[-1,-2,2,4],[-3,2,6,6]],
      walls: [[-1.15,-2,0.3,4],[0.85,-2,0.3,4]],
      hazards: [],
      coins: [[0,-5,1],[0,-3,1],[0,0,1],[-2,4,5],[2,4,5],[0,6,1]],
      spawn: [0,-6],
      goal: [0,6.5,1.3],
    },
    {
      name: 'Stepping Islands',
      time: 80,
      need: 8,
      message: 'Commit to each hop. Don’t fall into the void.',
      platforms: [[-1.5,-1.5,3,3],[-6,3,3,3],[3,3,3,3],[-1.5,8,3,3],[-1.5,13,3,4]],
      walls: [],
      hazards: [],
      coins: [[-4.5,4.5,1],[4.5,4.5,1],[0,9.5,5],[0,14,1],[-0.5,15,5],[0.5,15.5,1],[-5,4,1],[5,4,1]],
      spawn: [0,0],
      goal: [0,15.8,1.2],
    },
    {
      name: 'The Ring',
      time: 95,
      need: 12,
      message: 'Circle the hazard pit. Blue coins are worth 10.',
      platforms: [[-8,-8,16,16]],
      walls: [[-3.2,-0.3,0.4,0.6],[2.8,-0.3,0.4,0.6]],
      hazards: [[-3,-3,6,6]],
      coins: [[-6,-6,1],[0,-6,1],[6,-6,1],[6,0,5],[6,6,1],[0,6,5],[-6,6,1],[-6,0,10],[-5,-2,1],[5,-2,1],[-5,2,1],[5,2,1]],
      spawn: [0,-6.5],
      goal: [0,6.8,1.3],
    },
  ];

  const BALL_R = 0.35;
  const MAX_TILT = 22 * Math.PI / 180;
  const TILT_SPEED = 55 * Math.PI / 180;
  const GRAVITY = 18;
  const FRICTION = 0.22;
  const MAX_SPEED = 14;

  const keys = new Set();
  let levelIndex = 0;
  let state = 'title'; // title | play | won | fell | time
  let coins = 0;
  let lives = 3;
  let timeLeft = 0;
  let banner = '';
  let anim = 0;
  let ball = { x:0, z:0, vx:0, vz:0, tiltX:0, tiltZ:0, tx:0, tz:0 };
  let coinTaken = [];
  let cam = { x:0, z:0 };
  let pointerTilt = null;
  let last = performance.now();

  function level() { return LEVELS[levelIndex]; }

  function resetAttempt(full) {
    const L = level();
    if (full) lives = 3;
    coins = 0;
    timeLeft = L.time;
    banner = L.message;
    coinTaken = L.coins.map(() => false);
    ball = { x:L.spawn[0], z:L.spawn[1], vx:0, vz:0, tiltX:0, tiltZ:0, tx:0, tz:0 };
    cam = { x:ball.x, z:ball.z };
    state = 'play';
    syncHud();
  }

  function syncHud() {
    const L = level();
    document.getElementById('hLevel').textContent = `${levelIndex+1}/${LEVELS.length} · ${L.name}`;
    document.getElementById('hCoins').textContent = coins;
    document.getElementById('hNeed').textContent = L.need;
    document.getElementById('hTime').textContent = timeLeft.toFixed(1);
    document.getElementById('hLives').textContent = lives;
    document.getElementById('hMsg').textContent =
      state === 'play' && coins >= L.need ? 'Goal unlocked!' :
      state === 'won' ? 'Cleared! Enter for next' :
      state === 'fell' || state === 'time' ? (lives > 0 ? 'Enter to retry' : 'Enter to restart') :
      state === 'title' ? 'Press Play' : '';
  }

  function onGround(x, z) {
    const L = level();
    for (const h of L.hazards) {
      if (x >= h[0] && x <= h[0]+h[2] && z >= h[1] && z <= h[1]+h[3]) return false;
    }
    const m = -BALL_R * 0.15;
    for (const p of L.platforms) {
      if (x >= p[0]-m && x <= p[0]+p[2]+m && z >= p[1]-m && z <= p[1]+p[3]+m) return true;
    }
    return false;
  }

  function resolveWalls() {
    for (const w of level().walls) resolveAabb(w[0], w[1], w[2], w[3]);
  }

  function resolveAabb(x, z, w, d) {
    const cx = Math.max(x, Math.min(x+w, ball.x));
    const cz = Math.max(z, Math.min(z+d, ball.z));
    let dx = ball.x - cx, dz = ball.z - cz;
    const dist2 = dx*dx + dz*dz;
    if (dist2 >= BALL_R*BALL_R) return;
    if (dist2 < 1e-10) {
      const left = Math.abs(ball.x - x), right = Math.abs(x+w - ball.x);
      const top = Math.abs(ball.z - z), bottom = Math.abs(z+d - ball.z);
      const m = Math.min(left, right, top, bottom);
      if (m === left) { ball.x = x - BALL_R; ball.vx = Math.min(0, ball.vx)*-0.35; }
      else if (m === right) { ball.x = x+w + BALL_R; ball.vx = Math.max(0, ball.vx)*-0.35; }
      else if (m === top) { ball.z = z - BALL_R; ball.vz = Math.min(0, ball.vz)*-0.35; }
      else { ball.z = z+d + BALL_R; ball.vz = Math.max(0, ball.vz)*-0.35; }
      return;
    }
    const dist = Math.sqrt(dist2);
    const nx = dx/dist, nz = dz/dist;
    ball.x = cx + nx*BALL_R;
    ball.z = cz + nz*BALL_R;
    const vn = ball.vx*nx + ball.vz*nz;
    if (vn < 0) { ball.vx -= 1.35*vn*nx; ball.vz -= 1.35*vn*nz; }
  }

  function approach(c, t, maxd) {
    const d = t - c;
    if (Math.abs(d) <= maxd) return t;
    return c + Math.sign(d) * maxd;
  }

  function setInputFromKeys() {
    if (pointerTilt) {
      ball.tx = pointerTilt.tx;
      ball.tz = pointerTilt.tz;
      return;
    }
    let tx = 0, tz = 0;
    if (keys.has('ArrowLeft') || keys.has('a') || keys.has('A')) tz += MAX_TILT;
    if (keys.has('ArrowRight') || keys.has('d') || keys.has('D')) tz -= MAX_TILT;
    if (keys.has('ArrowUp') || keys.has('w') || keys.has('W')) tx -= MAX_TILT;
    if (keys.has('ArrowDown') || keys.has('s') || keys.has('S')) tx += MAX_TILT;
    const mag = Math.hypot(tx, tz);
    if (mag > MAX_TILT) { tx = tx/mag*MAX_TILT; tz = tz/mag*MAX_TILT; }
    ball.tx = tx; ball.tz = tz;
  }

  function update(dt) {
    anim += dt;
    if (state !== 'play') return;
    setInputFromKeys();
    ball.tiltX = approach(ball.tiltX, ball.tx, TILT_SPEED*dt);
    ball.tiltZ = approach(ball.tiltZ, ball.tz, TILT_SPEED*dt);
    const ax = GRAVITY * Math.sin(ball.tiltZ);
    const az = -GRAVITY * Math.sin(ball.tiltX);
    ball.vx += ax * dt;
    ball.vz += az * dt;
    let speed = Math.hypot(ball.vx, ball.vz);
    if (speed > 1e-6) {
      const decel = FRICTION * GRAVITY * Math.cos(Math.hypot(ball.tiltX, ball.tiltZ)) * dt;
      const ns = Math.max(0, speed - decel);
      ball.vx *= ns/speed; ball.vz *= ns/speed;
      speed = ns;
    }
    if (speed > MAX_SPEED) {
      ball.vx *= MAX_SPEED/speed; ball.vz *= MAX_SPEED/speed;
    }
    ball.x += ball.vx * dt;
    ball.z += ball.vz * dt;
    resolveWalls();

    const L = level();
    const grabR = BALL_R + 0.35;
    L.coins.forEach((c, i) => {
      if (coinTaken[i]) return;
      const dx = ball.x - c[0], dz = ball.z - c[1];
      if (dx*dx + dz*dz <= grabR*grabR) { coinTaken[i] = true; coins += c[2]; }
    });

    const open = coins >= L.need;
    const gdx = ball.x - L.goal[0], gdz = ball.z - L.goal[1];
    const gr = L.goal[2] + BALL_R*0.5;
    if (open && gdx*gdx + gdz*gdz <= gr*gr) {
      state = 'won';
      banner = 'Goal!';
      syncHud();
      return;
    }

    timeLeft -= dt;
    if (timeLeft <= 0) {
      timeLeft = 0;
      state = 'time';
      lives = Math.max(0, lives - 1);
      banner = "Time's up!";
      syncHud();
      return;
    }
    if (!onGround(ball.x, ball.z)) {
      state = 'fell';
      lives = Math.max(0, lives - 1);
      banner = 'Fell away!';
      syncHud();
      return;
    }
    syncHud();
  }

  function project(x, z, y) {
    const lx = x - cam.x, lz = z - cam.z;
    const y1 = y * Math.cos(ball.tiltX) - lz * Math.sin(ball.tiltX);
    const z1 = y * Math.sin(ball.tiltX) + lz * Math.cos(ball.tiltX);
    const x2 = lx * Math.cos(ball.tiltZ) + y1 * Math.sin(ball.tiltZ);
    const y2 = -lx * Math.sin(ball.tiltZ) + y1 * Math.cos(ball.tiltZ);
    return [x2, y2 + 7.5, z1 + 12];
  }

  function toScreen(ex, ey, ez) {
    const z = Math.max(0.35, ez);
    const f = 420;
    return [960*0.5 + (ex*f)/z, 600*0.42 - (ey*f)/z];
  }

  function poly(pts, fill, stroke) {
    ctx.beginPath();
    pts.forEach((p,i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
    ctx.closePath();
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 2; ctx.stroke(); }
  }

  function quad(x0,z0,x1,z1,x2,z2,x3,z3,y,fill,stroke) {
    const pts = [[x0,z0],[x1,z1],[x2,z2],[x3,z3]].map(([x,z]) => {
      const p = project(x,z,y); return toScreen(p[0],p[1],p[2]);
    });
    poly(pts, fill, stroke);
    return pts;
  }

  function draw() {
    // sky
    const g = ctx.createLinearGradient(0,0,0,600);
    g.addColorStop(0, '#6fb6e8');
    g.addColorStop(1, '#d7ecfa');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,960,600);

    ctx.fillStyle = 'rgba(90,140,110,0.35)';
    ctx.beginPath();
    ctx.moveTo(0, 330);
    for (let x=0; x<=960; x+=40) {
      ctx.lineTo(x, 312 + Math.sin(x*0.01)*28 + Math.cos(x*0.023)*18);
    }
    ctx.lineTo(960,600); ctx.lineTo(0,600); ctx.fill();

    cam.x += (ball.x - cam.x) * 0.12;
    cam.z += (ball.z - cam.z) * 0.12;

    const L = level();
    const plats = [...L.platforms].sort((a,b) => (a[1]+a[3]) - (b[1]+b[3]));
    for (const p of plats) {
      const x0=p[0], z0=p[1], x1=p[0]+p[2], z1=p[1]+p[3];
      const top = quad(x0,z0,x1,z0,x1,z1,x0,z1,0,'#3e9650','#244e2c');
      const a = toScreen(...project(x1,z1,-0.55));
      const b = toScreen(...project(x0,z1,-0.55));
      poly([top[2], top[3], b, a], '#2c703a', null);
    }
    for (const h of L.hazards) {
      quad(h[0],h[1],h[0]+h[2],h[1],h[0]+h[2],h[1]+h[3],h[0],h[1]+h[3],0.02,'rgba(40,40,48,0.85)','rgba(220,80,70,0.5)');
    }
    for (const w of L.walls) {
      const x0=w[0], z0=w[1], x1=w[0]+w[2], z1=w[1]+w[3];
      quad(x0,z0,x1,z0,x1,z1,x0,z1,0.9,'#d2c8b9', null);
      quad(x0,z0,x1,z0,x1,z1,x0,z1,0,'#a89c8c', null);
    }

    const open = coins >= L.need;
    {
      const segs = 24, pts = [];
      const r = L.goal[2] + (open ? 0.12*Math.sin(anim*6) : 0);
      for (let i=0;i<segs;i++) {
        const a = i*Math.PI*2/segs;
        const p = project(L.goal[0]+Math.cos(a)*r, L.goal[1]+Math.sin(a)*r, open?0.05:0.02);
        pts.push(toScreen(p[0],p[1],p[2]));
      }
      poly(pts, open ? 'rgba(255,220,70,0.8)' : 'rgba(90,90,100,0.55)', open ? '#fff5b4' : '#a0a0b4');
    }

    L.coins.forEach((c,i) => {
      if (coinTaken[i]) return;
      const bob = Math.sin(anim*4 + c[0] + c[1]) * 0.12;
      const p = project(c[0], c[1], 0.45+bob);
      const s = toScreen(p[0],p[1],p[2]);
      const scale = 18 / Math.max(0.55, p[2]);
      const color = c[2]===10 ? '#468cff' : c[2]===5 ? '#e64646' : '#ffd232';
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.beginPath(); ctx.ellipse(s[0], s[1]+scale*0.45, scale*0.7, scale*0.25, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = color;
      ctx.beginPath(); ctx.arc(s[0], s[1], scale*0.55, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(s[0]-scale*0.15, s[1]-scale*0.18, scale*0.15, 0, Math.PI*2); ctx.fill();
    });

    // ball
    {
      const sh = toScreen(...project(ball.x, ball.z, 0.02));
      const p = project(ball.x, ball.z, BALL_R);
      const s = toScreen(p[0],p[1],p[2]);
      const scale = (28 * BALL_R * 2) / Math.max(0.5, p[2]);
      ctx.fillStyle = 'rgba(0,0,0,0.28)';
      ctx.beginPath(); ctx.ellipse(sh[0], sh[1], scale*0.7, scale*0.28, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#e64637';
      ctx.beginPath(); ctx.arc(s[0], s[1], scale/2, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#ffa996';
      ctx.beginPath(); ctx.arc(s[0]-scale*0.12, s[1]-scale*0.15, scale*0.16, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#781e19'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(s[0], s[1], scale/2, 0, Math.PI*2); ctx.stroke();
    }

    if (state === 'title') {
      overlay('Neverball Packages', 'Click Play · Arrow keys / WASD tilt the floor');
    } else if (state === 'won') {
      overlay('Cleared!', 'Enter / click for next level');
    } else if (state === 'fell' || state === 'time') {
      overlay(banner || 'Try again', lives > 0 ? 'Enter to retry' : 'Enter to restart level');
    } else if (banner && anim < 3.5) {
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.fillRect(220, 530, 520, 40);
      ctx.fillStyle = '#fff';
      ctx.font = '15px Trebuchet MS, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(banner, 480, 555);
    }
  }

  function overlay(title, sub) {
    ctx.fillStyle = 'rgba(10,16,28,0.55)';
    ctx.fillRect(0,0,960,600);
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.font = 'bold 42px Georgia, serif';
    ctx.fillText(title, 480, 280);
    ctx.font = '16px Trebuchet MS, sans-serif';
    ctx.fillText(sub, 480, 320);
  }

  function continueFlow() {
    if (state === 'title') { resetAttempt(true); return; }
    if (state === 'won') {
      if (levelIndex + 1 < LEVELS.length) { levelIndex++; resetAttempt(true); }
      else { state = 'title'; levelIndex = 0; syncHud(); }
      return;
    }
    if (state === 'fell' || state === 'time') {
      resetAttempt(lives <= 0);
    }
  }

  window.addEventListener('keydown', (e) => {
    keys.add(e.key);
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
    if (e.key === 'Enter' || e.key === ' ') continueFlow();
    if (e.key === 'r' || e.key === 'R') resetAttempt(true);
  });
  window.addEventListener('keyup', (e) => keys.delete(e.key));

  function pointerToTilt(ev) {
    const rect = canvas.getBoundingClientRect();
    const x = (ev.clientX - rect.left) / rect.width;
    const y = (ev.clientY - rect.top) / rect.height;
    const tz = (0.5 - x) * 2 * MAX_TILT;
    const tx = (y - 0.5) * 2 * MAX_TILT;
    const mag = Math.hypot(tx, tz) || 1;
    const s = Math.min(1, mag / MAX_TILT);
    pointerTilt = { tx: tx/mag*MAX_TILT*s, tz: tz/mag*MAX_TILT*s };
  }
  canvas.addEventListener('pointerdown', (e) => { canvas.setPointerCapture(e.pointerId); pointerToTilt(e); if (state!=='play') continueFlow(); });
  canvas.addEventListener('pointermove', (e) => { if (pointerTilt) pointerToTilt(e); });
  canvas.addEventListener('pointerup', () => { pointerTilt = null; });
  canvas.addEventListener('pointercancel', () => { pointerTilt = null; });

  document.getElementById('btnStart').onclick = () => continueFlow();
  document.getElementById('btnRestart').onclick = () => { if (state==='title') return; resetAttempt(true); };

  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  syncHud();
  requestAnimationFrame(frame);
})();
  </script>
</body>
</html>
