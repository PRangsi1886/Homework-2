<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Operation Ferrum Wings</title>
<style>
:root{--navy:#050b14;--ink:#010307;--cyan:#59f5ff;--red:#ff3e2b;--orange:#ff9a43;--chrome:#d9e4e5;--muted:#81909a}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}body{display:grid;place-items:center;color:#fff;font-family:"Arial Narrow",Impact,"Franklin Gothic Condensed",sans-serif}
.reel{position:relative;width:min(100vw,56.25vh);height:min(177.7778vw,100vh);overflow:hidden;isolation:isolate;background:var(--navy);aspect-ratio:9/16}
.space{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 38%,#172b3a 0,#09131f 34%,#03070e 75%,#010206 100%)}
.space:before{content:"";position:absolute;inset:0;opacity:.48;background-image:radial-gradient(circle at 12% 15%,#fff 0 1px,transparent 1.5px),radial-gradient(circle at 84% 22%,#8ceff4 0 1px,transparent 1.5px),radial-gradient(circle at 20% 70%,#fff 0 1px,transparent 1.5px),radial-gradient(circle at 90% 77%,#fff 0 1px,transparent 1.5px);background-size:260px 310px,350px 390px,320px 280px,410px 360px;animation:stars 14s linear infinite}
@keyframes stars{to{transform:translateY(24px)}}
.warning{position:absolute;z-index:20;inset:0;background:var(--red);opacity:0;pointer-events:none;animation:warning .35s steps(2,end) both}
@keyframes warning{0%,55%{opacity:.72}100%{opacity:0}}
.grid{position:absolute;left:-18%;right:-18%;bottom:180px;height:650px;opacity:.22;transform:perspective(400px) rotateX(58deg) rotateZ(-5deg);transform-origin:bottom;background-image:linear-gradient(rgba(255,61,40,.9) 2px,transparent 2px),linear-gradient(90deg,rgba(255,61,40,.9) 2px,transparent 2px);background-size:68px 68px;mask-image:linear-gradient(to top,#000,transparent 92%);animation:gridin 1.2s .25s both}
@keyframes gridin{from{opacity:0}to{opacity:.22}}
.scan{position:absolute;z-index:18;inset:0;pointer-events:none;opacity:.12;background:repeating-linear-gradient(0deg,transparent 0 10px,rgba(89,245,255,.13) 11px,transparent 12px);animation:scan 8s linear infinite}
@keyframes scan{to{transform:translateY(28px)}}
.vignette{position:absolute;z-index:19;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.62),transparent 22%,transparent 78%,rgba(0,0,0,.62)),linear-gradient(0deg,rgba(0,0,0,.82),transparent 23%,transparent 77%,rgba(0,0,0,.58))}
.corner{position:absolute;z-index:25;width:32px;height:32px;border-color:var(--red);border-style:solid}.c1{top:42px;left:38px;border-width:2px 0 0 2px}.c2{top:42px;right:38px;border-width:2px 2px 0 0}.c3{bottom:42px;left:38px;border-width:0 0 2px 2px}.c4{bottom:42px;right:38px;border-width:0 2px 2px 0}
.topline{position:absolute;z-index:25;top:58px;left:68px;right:68px;display:flex;justify-content:space-between;align-items:center;font:700 14px/1 monospace;letter-spacing:2px;color:var(--cyan)}.topline b{color:var(--red);font-size:17px;margin-right:7px}.live{color:#dce8e9;font-size:12px}.live i{color:var(--red);font-style:normal}
.title{position:absolute;z-index:12;top:150px;left:66px;right:54px;animation:titlein .9s .28s both}.eyebrow{margin-bottom:15px;color:var(--red);font:700 17px/1 monospace;letter-spacing:4px}.eyebrow:before{content:"// ";color:var(--cyan)}
h1{margin:0;text-transform:uppercase;font-size:82px;line-height:.82;letter-spacing:1px;font-weight:900;text-shadow:4px 5px 0 #26343c,0 0 24px rgba(89,245,255,.15)}h1 .main{display:block;color:var(--chrome);font-size:58px;letter-spacing:3px;margin-top:12px;text-shadow:2px 3px 0 #51616a,0 0 18px rgba(255,255,255,.17)}
.subtitle{margin-top:25px;max-width:610px;color:#dbe9e9;font-size:28px;line-height:1.04;letter-spacing:.2px}.subtitle em{font-style:normal;color:var(--cyan)}
@keyframes titlein{from{opacity:0;transform:translateY(14px);clip-path:inset(0 100% 0 0)}to{opacity:1;transform:none;clip-path:inset(0)}}
.browser{position:absolute;z-index:7;left:58px;right:58px;top:610px;height:690px;border:2px solid rgba(89,245,255,.8);border-radius:12px;background:rgba(5,12,20,.62);box-shadow:0 0 0 7px rgba(2,8,14,.8),0 0 36px rgba(0,229,255,.2),inset 0 0 35px #000;transform:rotate(-1deg);animation:browserin .9s 1.1s both}
@keyframes browserin{from{opacity:0;transform:rotate(-1deg) translateY(35px)}to{opacity:1;transform:rotate(-1deg)}}
.bar{height:45px;border-bottom:1px solid rgba(118,224,232,.42);display:flex;align-items:center;padding:0 16px;gap:8px;background:rgba(17,27,36,.95)}.bar i{width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:20px 0 #ffb02e,40px 0 #50e88c}.url{margin-left:50px;color:#8ba0a8;font:11px monospace;border:1px solid #334750;border-radius:4px;padding:7px 12px;flex:1;white-space:nowrap;overflow:hidden}
.screen{position:absolute;inset:45px 0 0;overflow:hidden;background:radial-gradient(circle at 50% 45%,#294752,#0a1821 34%,#03080f 78%)}.screen:before{content:"SECTOR 01  /  FERRUM RING";position:absolute;top:22px;left:25px;color:var(--cyan);font:11px monospace;letter-spacing:1px}.screen:after{content:"HP  ████████   AMMO  042   //   CHARGE  68%";position:absolute;bottom:24px;left:25px;right:25px;padding-top:13px;border-top:1px solid rgba(95,230,237,.4);color:#c8d5d6;font:11px monospace}
.reticle{position:absolute;left:50%;top:47%;width:188px;height:188px;transform:translate(-50%,-50%) scale(.35);border:1px solid rgba(81,243,255,.82);border-radius:50%;box-shadow:0 0 17px rgba(81,243,255,.5);animation:lock 1s 1.35s both}.reticle:before,.reticle:after{content:"";position:absolute;background:var(--cyan)}.reticle:before{width:230px;height:1px;left:-22px;top:93px}.reticle:after{height:230px;width:1px;top:-22px;left:93px}.reticle b{position:absolute;inset:19px;border:1px dashed rgba(255,63,38,.8);border-radius:50%;animation:spin 7s linear infinite}@keyframes lock{to{transform:translate(-50%,-50%) scale(1)}}@keyframes spin{to{transform:rotate(360deg)}}
.ship{position:absolute;left:50%;top:48%;width:470px;height:330px;transform:translate(-50%,-50%) scale(.72);opacity:0;filter:drop-shadow(0 0 18px rgba(95,237,255,.65));animation:shipin .8s 1.45s cubic-bezier(.16,.8,.22,1) both}.ship:after{content:"";position:absolute;inset:8% 4%;border:2px solid var(--red);opacity:.35;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);animation:rimmat .8s 1.45s both}.ship svg{width:100%;height:100%;overflow:visible}.thruster{animation:thrust .7s ease-in-out infinite alternate;transform-origin:50% 50%}@keyframes shipin{from{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(-8deg)}to{opacity:1;transform:translate(-50%,-50%) scale(.72) rotate(0)}}@keyframes rimmat{from{opacity:0;transform:scale(.4)}to{opacity:.35;transform:scale(1)}}@keyframes thrust{to{opacity:.55;transform:scaleY(1.2)}}
.cta{position:absolute;z-index:30;left:95px;right:95px;top:1352px;height:112px;display:flex;align-items:center;justify-content:center;gap:17px;border:2px solid var(--cyan);background:linear-gradient(90deg,rgba(0,220,232,.18),rgba(255,49,29,.3));box-shadow:0 0 24px rgba(0,235,255,.32),inset 0 0 22px rgba(0,0,0,.65);font-size:35px;font-weight:900;letter-spacing:3px;text-shadow:0 0 12px var(--cyan);animation:ctain .5s 2.35s both,ctapulse 1.5s 2.85s ease-in-out infinite}.cta:before{content:"▶";font-size:24px;color:var(--red)}@keyframes ctain{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes ctapulse{50%{box-shadow:0 0 42px rgba(255,54,32,.48),inset 0 0 22px rgba(0,0,0,.65)}}
.footer{position:absolute;z-index:25;bottom:62px;left:68px;right:68px;display:flex;justify-content:space-between;color:#82959e;font:11px monospace;letter-spacing:1px}.footer strong{color:var(--cyan)}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:1ms!important;animation-iteration-count:1!important;animation-delay:0ms!important;transition:none!important}.warning{opacity:0}.title,.browser,.ship,.reticle,.cta{opacity:1;transform:none}}
</style>
</head>
<body>
